<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dan's Projects</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #f3f4f6;
    padding: 48px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 32px 0; }
  .projects { display: flex; flex-direction: column; gap: 16px; }
  .card {
    display: block;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 10px;
    padding: 20px;
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover {
    border-color: #38bdf8;
    transform: translateY(-2px);
  }
  .card-title {
    color: #38bdf8;
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  .card-desc {
    color: #9ca3af;
    font-size: 14px;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Check out Dan's projects!</h1>
    <div class="projects">
      <a class="card" href="https://slackermandan.github.io/Outlands/">
        <p class="card-title">Outlands</p>
        <p class="card-desc">Content, info, and tools for the Outlands Ultima server.</p>
      </a>
    </div>
  </div>
</body>
</html>
